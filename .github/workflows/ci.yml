name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: apps/api/go.sum

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Monorepo Lint & Typecheck
        run: pnpm turbo run lint typecheck

      - name: Run Tests (Packages & Frontend)
        run: pnpm turbo run test

      - name: Run Golang API Tests
        run: |
          cd apps/api
          go test -v -race ./...

      - name: Build All Services
        run: pnpm turbo run build

  notify-slack:
    name: Notify Slack
    needs: [lint-and-test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send CI result to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*CI Pipeline Alert*\n• Status: *${{ needs.lint-and-test.result }}*\n• Branch: `${{ github.ref_name }}`\n• Commit: `${{ github.sha }}`\n• Triggered by: `${{ github.actor }}`\n• Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
