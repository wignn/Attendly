              type: object
              required: [file_format]
              properties:
                file_format:
                  type: string
                  enum: [CSV, XLSX, PDF]
                class_id:
                  type: string
                  format: uuid
                subject_id:
                  type: string
                  format: uuid
                from_date:
                  type: string
                  format: date
                to_date:
                  type: string
                  format: date
      responses:
        '202':
          description: Ekspor diproses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /exports/{job_id}:
    get:
      tags: [Exports]
      summary: Cek status dan link download pekerjaan ekspor
      operationId: getExportJob
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Status pekerjaan ekspor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /audit-logs:
    get:
      tags: [Audit Logs]
      summary: Daftar audit log (Super Admin)
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: entity
          in: query
          schema: { type: string }
        - name: entity_id
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: from_date
          in: query
          schema: { type: string, format: date }
        - name: to_date
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogs'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit-logs/{audit_log_id}:
    get:
      tags: [Audit Logs]
      summary: Detail audit log (Super Admin)
      operationId: getAuditLog
      security:
        - bearerAuth: []
      parameters:
        - name: audit_log_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogDetailResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Token tidak valid atau kedaluwarsa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Peran atau cakupan pengguna tidak memiliki akses
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Payload tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Data duplikat atau jadwal bentrok
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Data melanggar aturan bisnis
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalServerError:
      description: Kesalahan internal saat memproses permintaan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    TeacherId:
      name: teacher_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ScheduleId:
      name: schedule_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    TeacherFilter:
      name: teacher_id
      in: query
      schema: { $ref: '#/components/schemas/Uuid' }
    ClassFilter:
      name: class_id
      in: query
      schema: { $ref: '#/components/schemas/Uuid' }
    SubjectFilter:
      name: subject_id
      in: query
      schema: { $ref: '#/components/schemas/Uuid' }
    AcademicYearFilter:
      name: academic_year_id
      in: query
      schema: { $ref: '#/components/schemas/Uuid' }
    DayOfWeekFilter:
      name: day_of_week
      in: query
      schema: { type: integer, minimum: 1, maximum: 7 }
    OnDateFilter:
      name: on_date
      in: query
      schema: { type: string, format: date }
    ActiveFilter:
      name: active
      in: query
      schema: { type: boolean }
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    TeachingAssignmentWrite:
      type: object
      additionalProperties: false
      required: [teacher_id, class_id, subject_id, academic_year_id]
      properties:
        teacher_id: { $ref: '#/components/schemas/Uuid' }
        class_id: { $ref: '#/components/schemas/Uuid' }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        academic_year_id: { $ref: '#/components/schemas/Uuid' }
    TeachingAssignmentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        teacher_id: { $ref: '#/components/schemas/Uuid' }
        class_id: { $ref: '#/components/schemas/Uuid' }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        academic_year_id: { $ref: '#/components/schemas/Uuid' }
    TeachingAssignmentRecord:
      type: object
      required: [id, teacher_id, class_id, subject_id, academic_year_id, active, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        teacher_id: { $ref: '#/components/schemas/Uuid' }
        class_id: { $ref: '#/components/schemas/Uuid' }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        academic_year_id: { $ref: '#/components/schemas/Uuid' }
        active: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    TeachingAssignmentResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TeachingAssignmentRecord' }
    PaginatedTeachingAssignments:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/TeachingAssignmentRecord' }
    ScheduleCreate:
      type: object
      additionalProperties: false
      required: [teaching_assignment_id, day_of_week, starts_at, ends_at, effective_from]
      properties:
        teaching_assignment_id: { $ref: '#/components/schemas/Uuid' }
        day_of_week: { type: integer, minimum: 1, maximum: 7, description: Senin=1 hingga Minggu=7 }
        starts_at: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$' }
        ends_at: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$' }
        effective_from: { type: string, format: date }
        effective_until: { type: [string, 'null'], format: date }
    ScheduleUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        teaching_assignment_id: { $ref: '#/components/schemas/Uuid' }
        day_of_week: { type: integer, minimum: 1, maximum: 7 }
        starts_at: { type: string }
        ends_at: { type: string }
        effective_from: { type: string, format: date }
        effective_until: { type: [string, 'null'], format: date }
    ScheduleRecord:
      type: object
      required: [id, teaching_assignment_id, teacher_id, class_id, subject_id, academic_year_id, day_of_week, starts_at, ends_at, effective_from, active, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        teaching_assignment_id: { $ref: '#/components/schemas/Uuid' }
        teacher_id: { $ref: '#/components/schemas/Uuid' }
        class_id: { $ref: '#/components/schemas/Uuid' }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        academic_year_id: { $ref: '#/components/schemas/Uuid' }
        day_of_week: { type: integer, minimum: 1, maximum: 7 }
        starts_at: { type: string }
        ends_at: { type: string }
        effective_from: { type: string, format: date }
        effective_until: { type: [string, 'null'], format: date }
        active: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ScheduleResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ScheduleRecord' }
    PaginatedSchedules:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/ScheduleRecord' }
    SuccessEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data: {}
    PaginationMeta:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer
    PaginatedEnvelope:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    AttendanceCounts:
      type: object
      required: [present, excused, sick, unexcused_absent, total_recorded_sessions]
      properties:
        present:
          type: integer
          format: int64
        excused:
          type: integer
          format: int64
        sick:
          type: integer
          format: int64
        unexcused_absent:
          type: integer
          format: int64
        total_recorded_sessions:
          type: integer
          format: int64
    StudentAttendanceSummary:
      type: object
      required: [student, counts, attendance_rate]
      properties:
        student:
          $ref: '#/components/schemas/StudentRecord'
        counts:
          $ref: '#/components/schemas/AttendanceCounts'
        attendance_rate:
          type: number
          minimum: 0
          maximum: 100
    StudentRecord:
      type: object
      required: [id, student_number, full_name, class_id, active]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        student_number:
          type: string
        full_name:
          type: string
        class_id:
          $ref: '#/components/schemas/Uuid'
        active:
          type: boolean
    ClassRecord:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        homeroom_teacher_id:
          anyOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    SubjectRecord:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
    SubjectClassReport:
      type: object
      required: [class, subject, counts, attendance_rate]
      properties:
        class:
          $ref: '#/components/schemas/ClassRecord'
        subject:
          $ref: '#/components/schemas/SubjectRecord'
        counts:
          $ref: '#/components/schemas/AttendanceCounts'
        attendance_rate:
          type: number
          minimum: 0
          maximum: 100
    ClassAttendanceReport:
      type: object
      required: [class, counts, attendance_rate, students]
      properties:
        class:
          $ref: '#/components/schemas/ClassRecord'
        subject:
          anyOf:
            - $ref: '#/components/schemas/SubjectRecord'
            - type: 'null'
        counts:
          $ref: '#/components/schemas/AttendanceCounts'
        attendance_rate:
          type: number
          minimum: 0
          maximum: 100
        students:
          type: array
          items:
            $ref: '#/components/schemas/StudentAttendanceSummary'
    Activity:
      type: object
      required: [id, actor_id, action, entity, entity_id, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        actor_id:
          anyOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        action:
          type: string
        entity:
          type: string
        entity_id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    AdminDashboardData:
      type: object
      required: [date, total_students, total_teachers, attendance, attendance_rate_today]
      properties:
        date:
          type: string
          format: date
        total_students:
          type: integer
          format: int64
        total_teachers:
          type: integer
          format: int64
        attendance:
          $ref: '#/components/schemas/AttendanceCounts'
        attendance_rate_today:
          type: number
          minimum: 0
          maximum: 100
    TeacherDashboardData:
      type: object
      required: [attendance, attendance_rate, classes]
      properties:
        attendance:
          $ref: '#/components/schemas/AttendanceCounts'
        attendance_rate:
          type: number
          minimum: 0
          maximum: 100
        classes:
          type: array
          items:
            $ref: '#/components/schemas/SubjectClassReport'
    AdminDashboardResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AdminDashboardData'
    TeacherDashboardResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TeacherDashboardData'
    StudentAttendanceSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StudentAttendanceSummary'
    PaginatedSubjectClasses:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/SubjectClassReport'
    PaginatedClassAttendance:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ClassAttendanceReport'
            meta:
              description: Pagination metadata applies to the report's students array.
              $ref: '#/components/schemas/PaginationMeta'
    PaginatedActivities:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Activity'
    ErrorEnvelope:
      type: object
      required: [success, message, error]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
    AuthTokenPairResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          $ref: '#/components/schemas/AuthTokenPair'
    CurrentUserResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          $ref: '#/components/schemas/CurrentUser'
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Role:
      type: string
      enum: [SUPER_ADMIN, TEACHER, HOMEROOM_TEACHER]
    EntityStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    ErrorResponse:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    GoogleLoginRequest:
      type: object
      additionalProperties: false
      required: [id_token]
      properties:
        id_token:
          type: string
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    CurrentUser:
      type: object
      required: [id, email, name, roles, permissions]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
    AuthTokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/CurrentUser'
    Teacher:
      type: object
      required: [id, nip, full_name, email, status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nip:
          type: string
        full_name:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/EntityStatus'
    TeacherCreate:
      type: object
      required: [nip, full_name, email]
      properties:
        nip:
          type: string
        full_name:
          type: string
        email:
          type: string
          format: email
    Student:
      type: object
      description: Data siswa untuk pengelolaan. Penghapusan lunak mengisi deleted_at dan membuat active false tanpa menghapus riwayat kehadiran.
      required: [id, nis, full_name, class_id, current_class_name, status, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nis:
          type: string
        nisn:
          type: [string, 'null']
        full_name:
          type: string
        class_id:
          $ref: '#/components/schemas/Uuid'
        current_class_name:
          type: string
        status:
          $ref: '#/components/schemas/EntityStatus'
        deleted_at:
          type: [string, 'null']
          format: date-time
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    StudentCreate:
      type: object
      additionalProperties: false
      required: [nis, full_name, class_id]
      properties:
        nis:
          type: string
          minLength: 1
          maxLength: 50
          description: Nomor induk siswa yang unik.
        nisn:
          type: [string, 'null']
          description: Nomor induk siswa nasional opsional dan unik jika diisi.
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        class_id:
          $ref: '#/components/schemas/Uuid'
        effective_on:
          type: [string, 'null']
          format: date
          description: Tanggal mulai enrollment kelas (YYYY-MM-DD); bila dihilangkan memakai tanggal hari ini di Asia/Jakarta.
    StudentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nis:
          type: string
          minLength: 1
          maxLength: 50
        nisn:
          type: [string, 'null']
          description: Jika tidak diberikan atau null, nilai NISN saat ini tidak berubah.
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          description: Status siswa aktif atau tidak aktif.
    StudentTransfer:
      type: object
      additionalProperties: false
      required: [class_id]
      properties:
        class_id:
          $ref: '#/components/schemas/Uuid'
        effective_on:
          type: [string, 'null']
          format: date
          description: Tanggal berlakunya transfer (YYYY-MM-DD); bila dihilangkan memakai tanggal hari ini di Asia/Jakarta.
    StudentEnrollment:
      type: object
      required: [id, student_id, class_id, class_name, valid_from, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        student_id:
          $ref: '#/components/schemas/Uuid'
        class_id:
          $ref: '#/components/schemas/Uuid'
        class_name:
          type: string
        valid_from:
          type: string
          format: date
        valid_to:
          type: [string, 'null']
          format: date
        created_at:
          $ref: '#/components/schemas/Timestamp'
    StudentResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Student'
    StudentDeleteResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [id]
              properties:
                id:
                  $ref: '#/components/schemas/Uuid'
    StudentEnrollmentHistoryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/StudentEnrollment'
    PaginatedTeachers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Teacher'
    PaginatedStudents:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Student'
    AdminDashboard:
      type: object
      properties:
        date:
          type: string
          format: date
        total_students:
          type: integer
        total_teachers:
