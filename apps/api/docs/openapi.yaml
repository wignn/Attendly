openapi: 3.1.0
info:
  title: AbsenKu API
  version: 1.0.0
  description: |
    Spesifikasi kontrak API untuk frontend dan backend AbsenKu.

    Peran pengguna: SUPER_ADMIN, TEACHER, dan HOMEROOM_TEACHER.
    Semua waktu memakai ISO 8601; zona sekolah Asia/Jakarta.
servers:
  - url: https://attendly-api-three.vercel.app/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Auth
    description: Autentikasi dan sesi pengguna
  - name: Admin Dashboard
  - name: Teachers
  - name: Students
  - name: Classes
  - name: Subjects
  - name: Academic Years
  - name: Teaching Assignments
  - name: Schedules
  - name: Attendance
  - name: Reports
  - name: Exports
  - name: Audit Logs
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Daftar akun guru
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Akun berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/login:
    post:
      tags: [Auth]
      summary: Masuk dengan email dan kata sandi
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPairResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/google:
    post:
      tags: [Auth]
      summary: Masuk menggunakan Google
      operationId: loginWithGoogle
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPairResponse'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Perbarui access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Keluar dan cabut refresh token
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Berhasil keluar
  /me:
    get:
      tags: [Auth]
      summary: Ambil profil dan izin pengguna aktif
      operationId: getMe
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/dashboard:
    get:
      tags: [Admin Dashboard]
      summary: Ringkasan dashboard Super Admin
      operationId: getAdminDashboard
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /teachers:
    get:
      tags: [Teachers]
      summary: Daftar guru
      operationId: listTeachers
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeachers'
    post:
      tags: [Teachers]
      summary: Tambah guru
      operationId: createTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherCreate'
      responses:
        '201':
          description: Berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teachers/{teacher_id}:
    get:
      tags: [Teachers]
      summary: Detail guru
      operationId: getTeacher
      security:
        - bearerAuth: []
      parameters:
        - name: teacher_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Teachers]
      summary: Update guru (Super Admin)
      operationId: updateTeacher
      security:
        - bearerAuth: []
      parameters:
        - name: teacher_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nip: { type: string }
                full_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '200':
          description: Berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Teachers]
      summary: Nonaktifkan guru (Super Admin)
      operationId: deleteTeacher
      security:
        - bearerAuth: []
      parameters:
        - name: teacher_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Berhasil dinonaktifkan }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /students:
    get:
      tags: [Students]
      summary: Daftar siswa
      description: Hanya SUPER_ADMIN. Siswa terhapus lunak tidak disertakan kecuali include_deleted=true.
      operationId: listStudents
      x-required-roles: [SUPER_ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          description: Cari berdasarkan NIS, NISN, atau nama lengkap.
          schema: {type: string}
        - name: class_id
          in: query
          description: Filter menurut kelas saat ini.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: status
          in: query
          schema: {type: string, enum: [ACTIVE, INACTIVE]}
        - name: include_deleted
          in: query
          description: Sertakan siswa yang dihapus lunak.
          schema: {type: boolean, default: false}
        - name: sort_by
          in: query
          schema: {type: string, enum: [nis, full_name, class_name, created_at], default: created_at}
        - name: sort_order
          in: query
          schema: {type: string, enum: [asc, desc], default: asc}
      responses:
        '200':
          description: Daftar siswa dan metadata pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudents'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Students]
      summary: Tambah siswa
      description: Hanya SUPER_ADMIN. Siswa baru aktif; effective_on yang tidak diberikan memakai tanggal hari ini di Asia/Jakarta.
      operationId: createStudent
      x-required-roles: [SUPER_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreate'
      responses:
        '201':
          description: Siswa berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: NIS atau NISN sudah digunakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /students/{student_id}:
    parameters:
      - name: student_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags: [Students]
      summary: Ambil detail siswa
      description: Hanya SUPER_ADMIN. Siswa terhapus lunak tidak ditemukan.
      operationId: getStudent
      x-required-roles: [SUPER_ADMIN]
      responses:
        '200':
          description: Detail siswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Students]
      summary: Perbarui data atau status siswa
      description: Hanya SUPER_ADMIN. Perubahan kelas harus dilakukan melalui operasi transfer enrollment.
      operationId: updateStudent
      x-required-roles: [SUPER_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdate'
      responses:
        '200':
          description: Siswa berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: NIS atau NISN sudah digunakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Students]
      summary: Hapus lunak siswa
      description: Hanya SUPER_ADMIN. Menandai siswa tidak aktif dan mengisi deleted_at; rekaman siswa dan kehadiran dipertahankan.
      operationId: deleteStudent
      x-required-roles: [SUPER_ADMIN]
      responses:
        '200':
          description: Siswa berhasil dihapus lunak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDeleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /students/{student_id}/enrollments:
    parameters:
      - name: student_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags: [Students]
      summary: Ambil riwayat enrollment kelas siswa
      description: Hanya SUPER_ADMIN. Mengembalikan enrollment secara kronologis dari yang terlama ke terbaru.
      operationId: listStudentEnrollments
      x-required-roles: [SUPER_ADMIN]
      responses:
        '200':
          description: Riwayat enrollment siswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnrollmentHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Students]
      summary: Pindahkan siswa ke kelas lain
      description: Hanya SUPER_ADMIN. effective_on menerima YYYY-MM-DD; jika tidak diberikan tanggal hari ini di Asia/Jakarta digunakan. Tanggal masa depan ditolak; tanggal yang sama dengan awal enrollment berjalan diperbolehkan.
      operationId: transferStudentEnrollment
      x-required-roles: [SUPER_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentTransfer'
      responses:
        '201':
          description: Enrollment berhasil dipindahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transfer bentrok dengan riwayat enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /classes:
    get:
      tags: [Classes]
      summary: Daftar kelas
      operationId: listClasses
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: academic_year_id
          in: query
          schema: { type: string, format: uuid }
        - name: homeroom_teacher_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClasses'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Classes]
      summary: Tambah kelas (Super Admin)
      operationId: createClass
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassCreateRequest'
      responses:
        '201':
          description: Berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassDetailResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /classes/{class_id}:
    get:
      tags: [Classes]
      summary: Detail kelas
      operationId: getClass
      security:
        - bearerAuth: []
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassDetailResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Classes]
      summary: Update kelas (Super Admin)
      operationId: updateClass
      security:
        - bearerAuth: []
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassUpdateRequest'
      responses:
        '200':
          description: Berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassDetailResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Classes]
      summary: Hapus kelas (Super Admin)
      operationId: deleteClass
      security:
        - bearerAuth: []
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Berhasil dihapus }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /classes/{class_id}/students:
    get:
      tags: [Classes]
      summary: Daftar siswa dalam kelas
      operationId: listClassStudents
      security:
        - bearerAuth: []
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClassStudents'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Classes]
      summary: Tambahkan siswa ke kelas (Super Admin)
      operationId: addStudentToClass
      security:
        - bearerAuth: []
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_id]
              properties:
                student_id: { type: string, format: uuid }
                effective_date: { type: string, format: date }
      responses:
        '200': { description: Siswa berhasil ditambahkan }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /classes/{class_id}/students/{student_id}:
    delete:
      tags: [Classes]
      summary: Keluarkan siswa dari kelas (Super Admin)
      operationId: removeStudentFromClass
      security:
        - bearerAuth: []
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: student_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: effective_date
          in: query
          schema: { type: string, format: date }
      responses:
        '204': { description: Siswa berhasil dikeluarkan }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /subjects:
    get:
      tags: [Subjects]
      summary: Daftar mata pelajaran
      operationId: listSubjects
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubjects'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Subjects]
      summary: Tambah mata pelajaran (Super Admin)
      operationId: createSubject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectCreateRequest'
      responses:
        '201':
          description: Berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDetailResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /subjects/{id}:
    get:
      tags: [Subjects]
      summary: Detail mata pelajaran
      operationId: getSubject
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDetailResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Subjects]
      summary: Update mata pelajaran (Super Admin)
      operationId: updateSubject
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectUpdateRequest'
      responses:
        '200':
          description: Berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDetailResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Subjects]
      summary: Hapus mata pelajaran (Super Admin)
      operationId: deleteSubject
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Berhasil dihapus }
        '401': { $ref: '#/components/responses/Unauthorized' }
