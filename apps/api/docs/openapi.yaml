openapi: 3.1.0
info:
  title: AbsenKu API
  version: 1.0.0
  description: |
    Spesifikasi kontrak API untuk frontend dan backend AbsenKu.

    Peran pengguna: SUPER_ADMIN, TEACHER, dan HOMEROOM_TEACHER.
    Semua waktu memakai ISO 8601; zona sekolah Asia/Jakarta.
servers:
  - url: https://attendly-api-three.vercel.app/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Auth
    description: Autentikasi dan sesi pengguna
  - name: Admin Dashboard
  - name: Teachers
  - name: Students
  - name: Classes
  - name: Subjects
  - name: Academic Years
  - name: Teaching Assignments
  - name: Schedules
  - name: Attendance
  - name: Reports
  - name: Exports
  - name: Audit Logs
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Daftar akun guru
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Akun berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/login:
    post:
      tags: [Auth]
      summary: Masuk dengan email dan kata sandi
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPairResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/google:
    post:
      tags: [Auth]
      summary: Masuk menggunakan Google
      operationId: loginWithGoogle
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPairResponse'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Perbarui access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Keluar dan cabut refresh token
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Berhasil keluar
  /me:
    get:
      tags: [Auth]
      summary: Ambil profil dan izin pengguna aktif
      operationId: getMe
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/dashboard:
    get:
      tags: [Admin Dashboard]
      summary: Ringkasan dashboard Super Admin
      operationId: getAdminDashboard
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /teachers:
    get:
      tags: [Teachers]
      summary: Daftar guru
      operationId: listTeachers
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeachers'
    post:
      tags: [Teachers]
      summary: Tambah guru
      operationId: createTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherCreate'
      responses:
        '201':
          description: Berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
  /students:
    get:
      tags: [Students]
      summary: Daftar siswa
      description: Hanya SUPER_ADMIN. Siswa terhapus lunak tidak disertakan kecuali include_deleted=true.
      operationId: listStudents
      x-required-roles: [SUPER_ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          description: Cari berdasarkan NIS, NISN, atau nama lengkap.
          schema: {type: string}
        - name: class_id
          in: query
          description: Filter menurut kelas saat ini.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: active
          in: query
          schema: {type: boolean}
        - name: include_deleted
          in: query
          description: Sertakan siswa yang dihapus lunak.
          schema: {type: boolean, default: false}
        - name: sort_by
          in: query
          schema: {type: string, enum: [nis, full_name, class_name, created_at], default: created_at}
        - name: sort_order
          in: query
          schema: {type: string, enum: [asc, desc], default: asc}
      responses:
        '200':
          description: Daftar siswa dan metadata pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudents'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Students]
      summary: Tambah siswa
      description: Hanya SUPER_ADMIN. Siswa baru aktif; effective_on yang tidak diberikan memakai tanggal hari ini di Asia/Jakarta.
      operationId: createStudent
      x-required-roles: [SUPER_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreate'
      responses:
        '201':
          description: Siswa berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: NIS atau NISN sudah digunakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /students/{student_id}:
    parameters:
      - name: student_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags: [Students]
      summary: Ambil detail siswa
      description: Hanya SUPER_ADMIN. Siswa terhapus lunak tidak ditemukan.
      operationId: getStudent
      x-required-roles: [SUPER_ADMIN]
      responses:
        '200':
          description: Detail siswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Students]
      summary: Perbarui data atau status siswa
      description: Hanya SUPER_ADMIN. Perubahan kelas harus dilakukan melalui operasi transfer enrollment.
      operationId: updateStudent
      x-required-roles: [SUPER_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdate'
      responses:
        '200':
          description: Siswa berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: NIS atau NISN sudah digunakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Students]
      summary: Hapus lunak siswa
      description: Hanya SUPER_ADMIN. Menandai siswa tidak aktif dan mengisi deleted_at; rekaman siswa dan kehadiran dipertahankan.
      operationId: deleteStudent
      x-required-roles: [SUPER_ADMIN]
      responses:
        '200':
          description: Siswa berhasil dihapus lunak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDeleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /students/{student_id}/enrollments:
    parameters:
      - name: student_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags: [Students]
      summary: Ambil riwayat enrollment kelas siswa
      description: Hanya SUPER_ADMIN. Mengembalikan enrollment dari yang terbaru ke terlama.
      operationId: listStudentEnrollments
      x-required-roles: [SUPER_ADMIN]
      responses:
        '200':
          description: Riwayat enrollment siswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnrollmentHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Students]
      summary: Pindahkan siswa ke kelas lain
      description: Hanya SUPER_ADMIN. effective_on menerima YYYY-MM-DD; jika tidak diberikan tanggal hari ini di Asia/Jakarta digunakan.
      operationId: transferStudentEnrollment
      x-required-roles: [SUPER_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentTransfer'
      responses:
        '201':
          description: Enrollment berhasil dipindahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transfer bentrok dengan riwayat enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /classes:
    get:
      tags: [Classes]
      summary: Daftar kelas
      operationId: listClasses
      responses:
        '200':
          description: Berhasil
    post:
      tags: [Classes]
      summary: Tambah kelas
      operationId: createClass
      responses:
        '201':
          description: Berhasil dibuat
  /subjects:
    get:
      tags: [Subjects]
      summary: Daftar mata pelajaran
      operationId: listSubjects
      responses:
        '200':
          description: Berhasil
    post:
      tags: [Subjects]
      summary: Tambah mata pelajaran
      operationId: createSubject
      responses:
        '201':
          description: Berhasil dibuat
  /academic-years:
    get:
      tags: [Academic Years]
      summary: Daftar tahun ajaran
      operationId: listAcademicYears
      responses:
        '200':
          description: Berhasil
    post:
      tags: [Academic Years]
      summary: Tambah tahun ajaran
      operationId: createAcademicYear
      responses:
        '201':
          description: Berhasil dibuat
  /teaching-assignments:
    get:
      tags: [Teaching Assignments]
      summary: Daftar penugasan mengajar
      operationId: listTeachingAssignments
      responses:
        '200':
          description: Berhasil
    post:
      tags: [Teaching Assignments]
      summary: Buat penugasan mengajar
      operationId: createTeachingAssignment
      responses:
        '201':
          description: Berhasil dibuat
  /schedules:
    get:
      tags: [Schedules]
      summary: Daftar jadwal kelas
      operationId: listSchedules
      responses:
        '200':
          description: Berhasil
    post:
      tags: [Schedules]
      summary: Tambah jadwal kelas
      operationId: createSchedule
      responses:
        '201':
          description: Berhasil dibuat
  /attendance-sessions:
    get:
      tags: [Attendance]
      summary: Daftar sesi absensi
      operationId: listAttendanceSessions
      responses:
        '200':
          description: Berhasil
    post:
      tags: [Attendance]
      summary: Buat atau ambil sesi dari jadwal
      operationId: createAttendanceSession
      responses:
        '201':
          description: Sesi dibuat
  /admin/activities:
    get:
      tags: [Audit Logs]
      summary: Riwayat aktivitas administrator
      operationId: listAdminActivities
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Aktivitas berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivities'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /teachers/me/dashboard:
    get:
      tags: [Teachers]
      summary: Dashboard guru untuk kelas dan mapel yang ditugaskan
      operationId: getTeacherDashboard
      responses:
        '200':
          description: Dashboard guru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherDashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /teachers/me/homeroom-dashboard:
    get:
      tags: [Teachers]
      summary: Dashboard wali kelas untuk semua mapel di kelasnya
      operationId: getHomeroomDashboard
      responses:
        '200':
          description: Dashboard wali kelas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherDashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /students/{student_id}/attendance-summary:
    get:
      tags: [Students]
      summary: Ringkasan kehadiran siswa
      operationId: getStudentAttendanceSummary
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Ringkasan siswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentAttendanceSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/subject-attendance:
    get:
      tags: [Reports]
      summary: Ringkasan kehadiran per kelas untuk satu mapel
      operationId: getSubjectAttendanceReport
      parameters:
        - name: subject_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Rekap kelas untuk mapel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubjectClasses'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /reports/classes/{class_id}/attendance:
    get:
      tags: [Reports]
      summary: Rincian kehadiran siswa untuk kelas dan mapel
      operationId: getClassAttendanceReport
      parameters:
        - name: class_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: subject_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Rekap kelas dan siswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClassAttendance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/homeroom/{class_id}:
    get:
      tags: [Reports]
      summary: Rekap wali kelas untuk semua mapel di kelas
      operationId: getHomeroomReport
      parameters:
        - name: class_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Rekap kelas lintas mapel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClassAttendance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /exports/attendance:
    post:
      tags: [Exports]
      summary: Buat ekspor rekap kehadiran
      operationId: createAttendanceExport
      responses:
        '202':
          description: Ekspor diproses
  /audit-logs:
    get:
      tags: [Audit Logs]
      summary: Daftar audit log
      operationId: listAuditLogs
      responses:
        '200':
          description: Berhasil
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Token tidak valid atau kedaluwarsa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Peran atau cakupan pengguna tidak memiliki akses
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Payload tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalServerError:
      description: Kesalahan internal saat memproses permintaan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data: {}
    PaginationMeta:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer
    PaginatedEnvelope:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    AttendanceCounts:
      type: object
      required: [present, excused, sick, unexcused_absent, total_recorded_sessions]
      properties:
        present:
          type: integer
          format: int64
        excused:
          type: integer
          format: int64
        sick:
          type: integer
          format: int64
        unexcused_absent:
          type: integer
          format: int64
        total_recorded_sessions:
          type: integer
          format: int64
    StudentAttendanceSummary:
      type: object
      required: [student, counts, attendance_rate]
      properties:
        student:
          $ref: '#/components/schemas/StudentRecord'
        counts:
          $ref: '#/components/schemas/AttendanceCounts'
        attendance_rate:
          type: number
          minimum: 0
          maximum: 100
    StudentRecord:
      type: object
      required: [id, student_number, full_name, class_id, active]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        student_number:
          type: string
        full_name:
          type: string
        class_id:
          $ref: '#/components/schemas/Uuid'
        active:
          type: boolean
    ClassRecord:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        homeroom_teacher_id:
          anyOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    SubjectRecord:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
    SubjectClassReport:
      type: object
      required: [class, subject, counts, attendance_rate]
      properties:
        class:
          $ref: '#/components/schemas/ClassRecord'
        subject:
          $ref: '#/components/schemas/SubjectRecord'
        counts:
          $ref: '#/components/schemas/AttendanceCounts'
        attendance_rate:
          type: number
          minimum: 0
          maximum: 100
    ClassAttendanceReport:
      type: object
      required: [class, counts, attendance_rate, students]
      properties:
        class:
          $ref: '#/components/schemas/ClassRecord'
        subject:
          anyOf:
            - $ref: '#/components/schemas/SubjectRecord'
            - type: 'null'
        counts:
          $ref: '#/components/schemas/AttendanceCounts'
        attendance_rate:
          type: number
          minimum: 0
          maximum: 100
        students:
          type: array
          items:
